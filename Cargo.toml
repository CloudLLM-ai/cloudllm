[workspace]
members = ["mcp"]
resolver = "2"

[package]
name = "cloudllm"
version = "0.16.0"
authors = ["Angel Leon <gubatron@gmail.com>"]
edition = "2018"
description = "A batteries-included Rust toolkit for building intelligent agents with LLM integration, multi-protocol tool support, multi-agent orchestration, and MentisDB-backed durable memory."
repository = "https://github.com/CloudLLM-ai/cloudllm"
license = "MIT"
documentation = "https://docs.rs/cloudllm/latest/cloudllm/"
# Allow-list, not a deny-list: only source, tests, examples and docs ship. Notes, agent
# files, generated images and HTML outputs in the repo root never reach crates.io.
include = [
    "/src/**",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/changelog.txt",
]

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }

# This is my own fork of the OpenAI Rust client, which has a few improvements over the original.
# https://github.com/cloudllm-ai/openai-rust
# 2.x exposes reqwest 0.13 types (`Client`, `Url`, `Response`); keep the reqwest
# major below in lockstep with it so the shared client stays type-compatible.
openai-rust2 = "2.0.0"

async-trait = "0.1.91"
log = "0.4.33"
env_logger = "0.11.11"
# Same reqwest major as openai-rust2 (its public API uses reqwest types).
reqwest = { version = "0.13.5", features = ["json", "stream", "form", "query"] }
futures-util = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
evalexpr = "13.1.0"
subtle = "2.6.1"
urlencoding = "2.1.3"
axum = { version = "0.8.9", optional = true }
tower = { version = "0.5.3", optional = true }
uuid = { version = "1.24.0", features = ["v4"] }
# 0.10+ is the current binary-storage MentisDB line. 0.4 was the last
# pre-modern series cloudllm targeted; Jsonl is legacy-only upstream.
# 0.10.10 is the latest 0.10.x; it adds only additive API (webhook CIDR policy)
# on top of 0.10.5 and carries the 0.10.9 security fixes.
mentisdb = "0.10.10"
mcp = { package = "cloudllm_mcp", path = "mcp", version = "0.4.0", features = ["server"] }

[dev-dependencies]
tempfile = "3.27.0"
futures-util = "0.3.33"
ratatui = "0.30.2"
crossterm = "0.29.0"

[features]
# MCP Server builder with HTTP support (requires axum and tower)
mcp-server = ["axum", "tower"]

[[example]]
name = "tetris_mcp_server"
required-features = ["mcp-server"]

[[example]]
name = "persistent_agent_chat"
required-features = ["mcp-server"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

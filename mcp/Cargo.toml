[package]
name = "cloudllm_mcp"
version = "0.4.0"
authors = ["Angel Leon <gubatron@gmail.com>"]
edition = "2021"
license = "MIT"
description = "Reusable MCP runtime, protocol types, and HTTP server/client primitives."
repository = "https://github.com/CloudLLM-ai/cloudllm"
documentation = "https://docs.rs/cloudllm_mcp/latest/mcp/"
readme = "README.md"
keywords = ["mcp", "model-context", "tools", "agents", "server"]
categories = ["development-tools", "network-programming", "asynchronous"]

[lib]
name = "mcp"

[features]
default = []
server = ["dep:axum"]

[dependencies]
async-trait = "0.1.91"
futures = "0.3.33"
log = "0.4.33"
# Same reqwest major as cloudllm / openai-rust2 (shared client types).
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
axum = { version = "0.8.9", optional = true }

[dev-dependencies]
# Paused clock for the SSE keepalive tests: intervals run instantly and exactly.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
axum = { version = "0.8.9" }
http-body-util = "0.1.4"
tower = { version = "0.5.3" }
